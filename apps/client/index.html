<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` põe o canvas embaixo do entalhe (é o que o `env(safe-area-inset-*)`
         do CSS depois compensa, só no HUD). `user-scalable=no` + `maximum-scale=1` matam o zoom
         por pinça, que num jogo de dois polegares acontece o tempo todo sem querer — o iOS ignora
         os dois, e é por isso que a camada de toque também barra `gesturestart`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tank Ricochete</title>
    <meta name="theme-color" content="#0b0f1a" />
    <!-- Ícone da aba desenhado inline (SVG procedural), no mesmo espírito do resto da arte: mira
         quente sobre a chapa escura do jogo. Sem arquivo externo, sem requisição, sem 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f1a'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23ffb347' stroke-width='2.6'/%3E%3Crect x='14.7' y='2' width='2.6' height='8' fill='%23ffb347'/%3E%3Crect x='14.7' y='22' width='2.6' height='8' fill='%23ffb347'/%3E%3Crect x='2' y='14.7' width='8' height='2.6' fill='%23ffb347'/%3E%3Crect x='22' y='14.7' width='8' height='2.6' fill='%23ffb347'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game"></div>

      <section id="lobby" class="tela"></section>
      <section id="hud" class="tela"></section>
      <section id="roundend" class="tela"></section>
      <section id="result" class="tela"></section>

      <!-- Overlay, não `.tela`: a contagem aparece POR CIMA da arena e do HUD, sem escondê-los. -->
      <div id="contagem"></div>

      <!-- Menu de pausa (Esc). Também overlay: a arena continua rodando atrás dele, porque a
           partida NÃO para para os outros jogadores. -->
      <div id="pausa"></div>

      <!-- Analógicos virtuais (M1). Só entram em cena em aparelho de toque; no teclado a camada
           nem é montada. Ficam por cima do canvas e ABAIXO das telas de interface. -->
      <div id="toque"></div>

      <!-- Botão de pausa do celular: o menu existe desde a Fase 13, mas só abria com Esc. -->
      <button id="btn-pausa-toque" type="button" title="PAUSA" aria-label="PAUSA">
        <i></i><i></i>
      </button>

      <!-- Aviso de virar o aparelho. Cobre tudo enquanto a tela estiver em pé. -->
      <div id="gire"></div>

      <!-- Fora das `.tela` de propósito: tela cheia vale no lobby, no jogo e no placar, e a
           Fullscreen API exige que a chamada saia de um gesto do usuário (clique ou tecla F). -->
      <button id="btn-tela-cheia" type="button" title="TELA CHEIA" aria-label="TELA CHEIA">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="cantos" d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" />
          <rect class="miolo" x="8.5" y="8.5" width="7" height="7" fill="currentColor" opacity=".35" />
        </svg>
        <span>F</span>
      </button>

      <pre id="erro"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
